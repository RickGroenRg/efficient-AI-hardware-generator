knobs:
  unroll_factor:
    type: integer
    values: [1, 2, 4, 8, 16]
  pipeline_ii_target:
    type: integer
    values: [1, 2, 4]
  array_partition_factor:
    type: integer
    values: [1, 2, 4, 8, 16]
  tile_m:
    type: integer
    values: [16, 32, 64, 128]
  tile_n:
    type: integer
    values: [16, 32, 64, 128]
rules:
  - name: tile_limits
    expression: tile_m <= 128 and tile_n <= 128
  - name: unroll_not_exceed_tile
    expression: unroll_factor <= tile_n
